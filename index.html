<title>Mudviejų ratas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; the wheel sits in a fixed compass bezel, everything else is quiet cards on a contour-line map ground. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#14232B; --muted:#5B6B73; --line:#D3DEDB; --contour:rgba(20,125,133,.09);
  --love:#E23E63; --on-love:#FFFFFF; --sea:#147D85; --sun:#E9A91F; --plum:#5A4BC4;
  --rimA:#F2C867; --rimB:#B97F1E; --bulb:#FFF4C9; --envB:#E9C7B8; --envF:#F6DDD1; --envT:#EFD0C2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --surface:#18262D; --ink:#EAF2F1; --muted:#94A6AD; --line:#2A3B43; --contour:rgba(60,184,191,.08);
  --love:#FF6B8A; --on-love:#22060D; --sea:#3CB8BF; --sun:#F4C04E; --plum:#8E82F0; --envB:#4A3740; --envF:#5B4550; --envT:#533E48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#18262D; --ink:#EAF2F1; --muted:#94A6AD; --line:#2A3B43; --contour:rgba(60,184,191,.08);
  --love:#FF6B8A; --on-love:#22060D; --sea:#3CB8BF; --sun:#F4C04E; --plum:#8E82F0; --envB:#4A3740; --envF:#5B4550; --envT:#533E48; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  background-image:repeating-radial-gradient(circle at 85% -120px,transparent 0 46px,var(--contour) 46px 47.5px);
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,.task,.num{font-family:var(--display)}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.streak{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.streak .num{font-size:1.4rem;font-weight:800;color:var(--love);font-variant-numeric:tabular-nums}
.streak small{color:var(--muted);font-size:.8rem}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--sun);padding:2px 0 2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 .95rem var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--love);border-color:var(--love);color:var(--on-love)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.pad:focus-visible,input:focus-visible,select:focus-visible,.hub:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
input,select{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
input{flex:1 1 160px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px;border:1px solid transparent;font-size:.75rem;color:var(--muted);font-weight:600}
.day.today{border-color:var(--line);color:var(--ink)}
.day.full{background:color-mix(in srgb,var(--love) 13%,transparent);color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dot.spun{border-color:var(--sea)}
.dot.done{border-color:var(--love);background:var(--love)}
.legend{font-size:.78rem;color:var(--muted);margin:0}
.frz{font-size:1.1rem;line-height:29px}
.pad{font:700 1.05rem var(--display);width:100%;min-height:96px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:12px}
.pad.wait{border-style:solid;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--bg))}
.pad.go{border-style:solid;border-color:var(--sea);background:var(--sea);color:var(--bg)}
.pad:disabled{cursor:default;opacity:.8}
/* wheel */
.stage{position:relative;width:min(100%,360px);aspect-ratio:1;margin:4px auto}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seg{stroke:rgba(255,255,255,.55);stroke-width:1.2}
.inner{fill:var(--ink)}
.bulb{fill:var(--bulb);opacity:.55;transition:opacity .15s}
.stage.spinning .bulb{animation:blink .32s steps(1) infinite}
.stage.spinning .bulb:nth-child(even){animation-delay:.16s}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.stage.won .bulb{animation:blink .5s steps(1) 4}
#pointer{transform-box:fill-box;transform-origin:50% 8%;transition:transform .09s ease-out}
#pointer.tick{transform:rotate(-16deg);transition:none}
.pin{fill:var(--rimA);stroke:var(--ink);stroke-width:1}
.stage svg{filter:drop-shadow(0 10px 18px rgba(20,35,43,.28))}
.sticker{position:absolute;width:15%;max-width:56px;animation:bob 4s ease-in-out infinite;pointer-events:none}
.sticker svg{width:100%;height:auto;filter:none;display:block}
.st1{left:-2%;top:2%;transform:rotate(-12deg)}.st2{right:-2%;top:4%;animation-delay:-1s}.st3{left:0;bottom:2%;animation-delay:-2s}.st4{right:0;bottom:0;animation-delay:-3s}
@keyframes bob{50%{translate:0 -6px}}
.pointer{fill:var(--love);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.hub{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--rimA);
  background:radial-gradient(circle at 35% 30%,#3a4f5a,var(--ink) 70%);color:#fff;font:800 1.05rem var(--display);letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 2px 6px rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.hub::before{content:'♥';color:var(--love);font-size:.85em}
.hub:disabled{cursor:default;font-size:.78rem;letter-spacing:0}
.hub:not(:disabled):active{transform:translate(-50%,-50%) scale(.95)}
#confetti{position:absolute;inset:-20%;width:140%;height:140%;pointer-events:none}
/* task cards */
.cat{font-size:.8rem;font-weight:700;color:var(--sea)}
.task{font-size:1.3rem;font-weight:700;line-height:1.25;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.state{font-size:.85rem;color:var(--muted)}
.state.ok{color:var(--love);font-weight:600}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats .num{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.stats span{font-size:.78rem;color:var(--muted)}
.miles{display:flex;gap:6px;flex-wrap:wrap}
.mile{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.mile.got{border-style:solid;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--ink)}
details summary{cursor:pointer;font-weight:600}
.own{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:.9rem;border-top:1px solid var(--line);padding-top:8px}
.own span{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.secret{font-size:.85rem;color:var(--plum);font-weight:600}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}
.foot button{font:inherit;color:inherit;background:none;border:0;text-decoration:underline;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:5}
/* reveal envelope */
#reveal{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(3px);padding:16px}
.env{position:relative;width:min(330px,88vw);height:200px;margin-top:190px;perspective:900px}
.env-back{position:absolute;inset:0;background:var(--envB);border-radius:10px}
.letter{position:absolute;left:12px;right:12px;bottom:10px;min-height:178px;background:var(--surface);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;z-index:2;transform:translateY(0);transition:transform .7s cubic-bezier(.2,.9,.3,1.1) .45s;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.letter .task{font-size:1.15rem}
.env-front{position:absolute;inset:0;z-index:3;background:var(--envF);border-radius:10px;clip-path:polygon(0 38%,50% 72%,100% 38%,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:var(--envT);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s ease-in,z-index 0s .25s;border-radius:10px 10px 0 0}
.seal{position:absolute;left:50%;top:52%;z-index:5;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--love);color:#fff;display:grid;place-items:center;font-size:1.3rem;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:opacity .2s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .letter{transform:translateY(-178px)}
/* in-app games */
.game{display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-direction:column;gap:6px}
.qt{margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .9rem var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip.on{background:var(--sea);border-color:var(--sea);color:#fff}
.chip.ok{background:color-mix(in srgb,var(--sea) 25%,var(--bg));border-color:var(--sea)}
.chip.bad{background:color-mix(in srgb,var(--love) 22%,var(--bg));border-color:var(--love)}
textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:84px;resize:vertical;width:100%}
.res{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.res li{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-top:1px solid var(--line);padding-top:6px}
.res b{font-variant-numeric:tabular-nums}
.ans{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem;overflow-wrap:anywhere}
.ans small{display:block;color:var(--muted);font-weight:600;margin-bottom:2px}
#mapOv{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mapbar{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
#mapInfo{flex:1;min-width:0;font-weight:700;font-family:var(--display)}
#map{flex:1;min-height:0;background:#dfe7e5}
.sound{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem}
.top-r{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){.pop,.sticker{animation:none}.letter,.flap{transition:none}}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Mudviejų ratas</h1><p class="sub" id="sub">Vienas sukimas per dieną. Užduotį atliekat Instagrame.</p></div>
    <div class="top-r"><button class="sound" id="soundBtn" type="button" aria-label="Garsas">🔊</button><div class="streak" title="Dienos iš eilės"><span>🔥</span><span class="num" id="streakNum">0</span><small>d. iš eilės</small></div></div>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="card" id="setup" hidden></div>
  <div class="card" id="pushCard" hidden></div>

  <div class="card">
    <h2>Ši savaitė</h2>
    <div class="week" id="week"></div>
    <p class="legend" id="legend"></p>
  </div>

  <div class="stage" id="stage">
    <svg viewBox="-114 -120 228 234" aria-hidden="true">
      <defs>
        <radialGradient id="segShade" cx="0" cy="0" r="92" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:#fff;stop-opacity:.25"/><stop offset=".5" style="stop-color:#fff;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.25"/></radialGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.42"/><stop offset=".42" style="stop-color:#fff;stop-opacity:0"/></linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rimA)"/><stop offset="1" style="stop-color:var(--rimB)"/></linearGradient>

      <g id="wheel"></g>

      <g id="pointer"><path class="pointer" d="M-11 -116 Q0 -122 11 -116 L0 -86 Z"/><circle cy="-112" r="3.5" class="pin"/></g>
    </svg>
    <span class="sticker st1"><svg viewBox="0 0 48 48"><path d="M24 15c-9-2.5-17 4-17 13.5S14.5 44 24 44s17-6 17-15.5S33 12.5 24 15z" fill="#FFB08A"/><path d="M24 15c-3 7-3 19 0 29" stroke="#EE8466" stroke-width="2" fill="none"/><path d="M24.5 14.5c2-6 8.5-8.5 14-6.5-2 5.5-8.5 7.5-14 6.5z" fill="#5BAE5B"/><path d="M24 15c0-4-1-7-3.5-9.5" stroke="#7A5232" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="16" cy="25" rx="3" ry="5" fill="#fff" opacity=".35"/></svg></span><span class="sticker st2"><svg viewBox="0 0 48 48"><path d="M10 6v38" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="11" y="8" width="29" height="19" fill="#fff" stroke="#222" stroke-width="1.4"/><rect x="11.00" y="8.00" width="7.25" height="6.33" fill="#222"/><rect x="25.50" y="8.00" width="7.25" height="6.33" fill="#222"/><rect x="18.25" y="14.33" width="7.25" height="6.33" fill="#222"/><rect x="32.75" y="14.33" width="7.25" height="6.33" fill="#222"/><rect x="11.00" y="20.66" width="7.25" height="6.33" fill="#222"/><rect x="25.50" y="20.66" width="7.25" height="6.33" fill="#222"/></svg></span><span class="sticker st3"><svg viewBox="0 0 48 48"><rect x="10" y="12" width="10" height="8" rx="2" fill="#D93A3A"/><rect x="28" y="12" width="10" height="8" rx="2" fill="#D93A3A"/><rect x="10" y="12" width="10" height="3" rx="1.5" fill="#FF7B6F"/><rect x="28" y="12" width="10" height="3" rx="1.5" fill="#FF7B6F"/><rect x="6" y="19" width="36" height="21" rx="3" fill="#E54444"/><rect x="6" y="19" width="36" height="5" rx="2" fill="#FF7B6F" opacity=".7"/></svg></span><span class="sticker st4"><svg viewBox="0 0 48 48"><path d="M24 45s14-14 14-25a14 14 0 1 0-28 0c0 11 14 25 14 25z" fill="#147D85"/><circle cx="24" cy="20" r="7.5" fill="#fff"/><path d="M24 24.5l-3.6-3.6a2.4 2.4 0 0 1 3.6-3.2 2.4 2.4 0 0 1 3.6 3.2z" fill="#E23E63"/></svg></span>
    <canvas id="confetti"></canvas>
    <button class="hub" id="hub" type="button">SUK</button>
  </div>

  <div class="card" id="mine"></div>
  <div class="card" id="theirs"></div>

  <div class="card">
    <h2>Progresas</h2>
    <div class="stats">
      <div><b class="num" id="sCur">0</b><span>dabartinė serija</span></div>
      <div><b class="num" id="sBest">0</b><span>ilgiausia serija</span></div>
      <div><b class="num" id="sDone">0</b><span>atlikta užduočių</span></div>
    </div>
    <div class="miles" id="miles"></div>
  </div>

  <details class="card" id="customBox">
    <summary id="customSum">Savos užduotys</summary>
    <form class="row" id="customForm">
      <select id="customFor" aria-label="Kam"><option value="other">Antrai pusei (slapta)</option><option value="both">Abiem</option></select>
      <select id="customCat" aria-label="Kategorija"></select>
      <input id="customText" maxlength="140" placeholder="Pvz.: atsiųsk savo rytinės kavos nuotrauką" aria-label="Užduoties tekstas">
      <button class="btn" type="submit">Pridėti</button>
    </form>
    <div id="customList"></div>
  </details>

  <p class="foot" id="foot"></p>
</div>
<div id="toast" hidden role="status"></div>
<div id="reveal" hidden><div class="env" id="env"><div class="env-back"></div><div class="letter"><span class="cat" id="rvCat"></span><p class="task" id="rvText"></p><button class="btn primary" id="rvOk" type="button">Priimu 💌</button></div><div class="env-front"></div><div class="flap"></div><div class="seal">♥</div></div></div>

      const l=srcLink(mine);if(l)m.append(el('div',{class:'row'},l))}
    else{if(game&&game!=='reakcija'){const gw=gameMine(game,id,mine);if(gw)m.append(gw)}
      if(game==='reakcija')m.append(pad('m'+id,ms=>patch(id,{status:'done',doneAt:Date.now(),score:ms},'Užskaityta!').then(()=>notify(other(),`${nameOf(S.me)} sužaidė reakcijos dvikovą ⚡`,`Vidurkis ${ms} ms. Pabandyk pralenkti!`))));

      srcLink(mine),
      el('button',{class:'btn',type:'button',onclick:()=>copyTask(mine,txt)},'Kopijuoti'),
      el('a',{class:'btn',href:'https://www.instagram.com/direct/inbox/',target:'_blank',rel:'noopener'},'Atverti Instagram'),
      !mine.rerolled&&el('button',{class:'btn',type:'button',disabled:busy,onclick:()=>spin(true)},'Keisti (1 kartą)')))}}
  // theirs

      if(ps.score){th.append(el('p',{class:'state'},`${pn} vidurkis: ${Number(ps.score)} ms.`+(ps.rival?` Tavo: ${Number(ps.rival)} ms. ${ps.rival<ps.score?'Pralenkei!':'Šįkart nepavyko.'}`:' Pabandyk pralenkti.')));

$('hub').addEventListener('click',()=>spin(false));
$('customForm').addEventListener('submit',e=>{e.preventDefault();const inp=$('customText'),text=inp.value.trim();if(!text||!store)return;

  store.addTask(doc).then(id=>{S.custom={...S.custom,[id]:doc};inp.value='';render();if(doc.for!=='both'){notify(doc.for,`${nameOf(S.me)} įrašė tau slaptą užduotį 🤫`,'Ji kada nors iškris rate.');toast('Slapta užduotis įrašyta 🤫')}else toast('Užduotis pridėta į ratą.')},()=>toast('Nepavyko pridėti.'))});

/* ---------- storage: Claude db in the artifact, Firebase on the hosted site, this device otherwise ---------- */
function localStore(){
  try{const d=JSON.parse(ls.get('mr_local')||'{}');S.players=d.players||{};S.spins=d.spins||{};S.custom=d.custom||{}}catch(e){}
  const save=()=>ls.set('mr_local',JSON.stringify({players:S.players,spins:S.spins,custom:S.custom}));
  return{async setDoc(){},async putPlayers(p){S.players=p;save()},async putSpin(id,d){S.spins={...S.spins,[id]:d};save()},async patchSpin(id,p){S.spins={...S.spins,[id]:{...S.spins[id],...p}};save()},
    async addTask(d){const id='l'+Date.now();S.custom={...S.custom,[id]:d};save();return id},async delTask(id){const n={...S.custom};delete n[id];S.custom=n;save()}}}
// `db` is either the artifact's store or a Firestore wrapper: both give doc(path) / collection(path) with the same calls.
function dbStore(db){
  const timer=setTimeout(()=>{S.note='slow';S.mode='db';render()},10000);
  const ok=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);if(S.note==='slow')S.note=''}S.mode='db'};
  const fail=()=>{clearTimeout(timer);S.note='err';S.mode='db';render()};
  const map=snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});return o};
  db.doc('game/players').onSnapshot(s=>{ok(s);S.pl=true;S.players=s.exists?s.data():{};render()},fail);
  db.collection('spins').orderBy('day','desc').limit(400).onSnapshot(s=>{ok(s);if(!busy)S.spins=map(s);render()},fail);
  db.collection('tasks').onSnapshot(s=>{ok(s);S.custom=map(s);render()},fail);
  db.collection('news').onSnapshot(s=>{const o=map(s);S.newsDb=Object.keys(o).map(id=>({...o[id],id}))},()=>{});
  return{setDoc:(p,d)=>db.doc(p).set(d),putPlayers:p=>db.doc('game/players').set(p),putSpin:(id,d)=>db.doc('spins/'+id).set(d),patchSpin:(id,p)=>db.doc('spins/'+id).update(p),
    addTask:async d=>(await db.collection('tasks').add(d)).id,delTask:id=>db.doc('tasks/'+id).delete()}}
const addScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)});
async function startFirebase(code){
  try{S.mode='load';render();
    if(!window.firebase){const v='https://www.gstatic.com/firebasejs/10.12.2/';await addScript(v+'firebase-app-compat.js');await addScript(v+'firebase-firestore-compat.js');firebase.initializeApp(FIREBASE)}
    const fs=firebase.firestore(),R='rooms/'+code+'/';store=dbStore({doc:p=>fs.doc(R+p),collection:p=>fs.collection(R+p)});ROOM=code;prepPush()}
  catch(e){store=localStore();S.pl=true;S.mode='local';render()}}
(async function boot(){
  S.me=ls.get('mr_me');if(S.me!=='a'&&S.me!=='b')S.me=null;render();
  fetch('news.json').then(r=>r.ok?r.json():[]).then(a=>{if(Array.isArray(a))S.newsFile=a}).catch(()=>{});
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(db)store=dbStore(db);
  else if(FIREBASE){const code=decodeURIComponent(location.hash.slice(1))||ls.get('mr_room')||'';
    if(ROOM_RE.test(code)){ls.set('mr_room',code);startFirebase(code)}else{S.mode='room';render()}}
  else{store=localStore();S.pl=true;S.mode='local';render()}
})();
